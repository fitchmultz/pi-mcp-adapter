name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Build interactive visualizer example
        run: |
          npm install --prefix examples/interactive-visualizer --no-package-lock --no-audit --no-fund
          npm run --prefix examples/interactive-visualizer build
      - name: Typecheck
        run: npm run typecheck
      - run: npm test
      - run: npm run test:oauth
      - run: npm run test:conformance
      - run: npm pack --dry-run
      - name: Git-install lifecycle smoke (npm install --omit=dev builds and prunes)
        run: |
          git clone --quiet . /tmp/omit-dev-smoke
          cd /tmp/omit-dev-smoke
          npm install --omit=dev
          node --input-type=module -e "await import('./dist/index.js'); console.log('dist loads')"
          test -f dist/mcp-keyring-helper.cjs
          test -f dist/mcp-script-worker.mjs
          test -f dist/app-bridge.bundle.js
          test ! -d node_modules/typescript
