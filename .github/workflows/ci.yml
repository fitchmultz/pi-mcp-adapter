name: MCP product contracts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.19.0'
          cache: npm

      - run: npm ci
      - name: Build interactive visualizer example
        run: |
          npm install --prefix examples/interactive-visualizer --no-package-lock --no-audit --no-fund
          npm run --prefix examples/interactive-visualizer build
      # Shared check:compat owns types, ordinary tests, OAuth and native pack/load.
      # This visualizer case needs its separately built example and is excluded there.
      - name: Interactive visualizer server
        run: npm exec -- vitest run __tests__/interactive-visualizer-server.test.ts
      - run: npm run test:conformance
      - name: Git-install lifecycle smoke (build, prune, and consumer types)
        run: |
          git clone --quiet . /tmp/omit-dev-smoke
          cd /tmp/omit-dev-smoke
          npm install --omit=dev
          # Plain node cannot import dist/index.js here: host packages (typebox,
          # @earendil-works/*) are pruned and provided at runtime by pi's loader
          # aliases. Assert emit + assets + prune instead; syntax-check the entry.
          node --check dist/index.js
          test -f dist/mcp-keyring-helper.cjs
          test -f dist/mcp-script-worker.mjs
          test -f dist/app-bridge.bundle.js
          test ! -d node_modules/typescript
          node "$GITHUB_WORKSPACE/scripts/check-consumer-types.mjs" "$PWD"
