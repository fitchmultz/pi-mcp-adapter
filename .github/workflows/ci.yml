name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      official-version:
        description: Official stable version resolved for this run; blank resolves latest
        type: string
        default: ""
      fork-ref:
        description: Maintained fork commit resolved for this run; blank resolves main
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PI_AUTOMATION_REF: f407404914bf6d048e4d952c62711df5103cc7ef # main

jobs:
  resolve:
    uses: fitchmultz/.github/.github/workflows/resolve-hosts.yml@f407404914bf6d048e4d952c62711df5103cc7ef # main
    with:
      automation-ref: f407404914bf6d048e4d952c62711df5103cc7ef # main
      official-version: ${{ inputs.official-version }}
      fork-ref: ${{ inputs.fork-ref }}

  compatibility:
    needs: resolve
    if: ${{ !cancelled() }}
    name: compatibility / compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - name: Require resolved latest hosts
        env:
          RESOLVE: ${{ needs.resolve.result }}
        run: test "$RESOLVE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Use the reviewed npm version
        run: |
          PM="$(jq -er .packageManager automation/package.json)"
          npm install --global "$PM"
      - name: Install native TUI prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y fd-find ripgrep
          sudo ln -sf "$(command -v fdfind)" /usr/local/bin/fd
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: fork
        with:
          repository: fitchmultz/pi
          ref: ${{ needs.resolve.outputs.fork-ref }}
          path: fork
          persist-credentials: false
      - name: Build fork once
        id: fork-build
        working-directory: fork
        env:
          FORK_REF: ${{ steps.fork.outputs.commit }}
          PI_OFFLINE: "1"
          PI_TELEMETRY: "0"
        run: |
          npm ci --ignore-scripts
          npm run hydrate:model-data
          git diff --exit-code
          npm run build:offline
          node ../automation/scripts/pack-fork.mjs . "$RUNNER_TEMP/fork-package" "$FORK_REF"
          git diff --exit-code
      - name: Use the extension npm version
        id: extension-npm
        run: |
          PM="$(jq -er .packageManager extension/package.json)"
          npm install --global "$PM"
      - name: Qualify official Pi
        if: ${{ !cancelled() && steps.fork-build.outcome == 'success' && steps.extension-npm.outcome == 'success' }}
        env:
          version: ${{ needs.resolve.outputs.official-version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node automation/scripts/qualify.mjs --repo pi-mcp-adapter --source "$GITHUB_WORKSPACE/extension" \
            --host official --target "$version" --output "$RUNNER_TEMP/official-evidence"
      - name: Qualify fork Pi
        if: ${{ !cancelled() && steps.fork-build.outcome == 'success' && steps.extension-npm.outcome == 'success' }}
        env:
          PI_COMPAT_FORK_REF: ${{ steps.fork.outputs.commit }}
        run: |
          node automation/scripts/qualify.mjs --repo pi-mcp-adapter --source "$GITHUB_WORKSPACE/extension" \
            --host fork --target "$RUNNER_TEMP/fork-package" --output "$RUNNER_TEMP/fork-evidence"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-qualification
          path: |
            ${{ runner.temp }}/official-evidence
            ${{ runner.temp }}/fork-evidence
          if-no-files-found: error
          retention-days: 3

  extras:
    defaults:
      run:
        working-directory: extension
    needs: resolve
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require resolved latest hosts
        working-directory: ${{ github.workspace }}
        env:
          RESOLVE: ${{ needs.resolve.result }}
        run: test "$RESOLVE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: extension
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: true
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            extension/examples/interactive-visualizer/package-lock.json
      - name: Use the extension npm version
        run: |
          PM="$(jq -er .packageManager package.json)"
          npm install --global "$PM"
      - name: Lockfiles resolve only from the public npm registry
        id: lockfiles
        run: |
          failed=0
          for lock in package-lock.json examples/interactive-visualizer/package-lock.json; do
            npx -y lockfile-lint@5.0.1 --type npm --allowed-hosts npm --validate-https --path "$lock" || failed=1
          done
          exit "$failed"
      - name: Install extension
        id: install
        if: ${{ !cancelled() && steps.lockfiles.outcome != 'skipped' }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fitchmultz/.github
          ref: ${{ env.PI_AUTOMATION_REF }}
          path: automation
          persist-credentials: false
        id: automation
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
      - name: Select the same latest official graph for extras
        id: host
        if: ${{ !cancelled() && steps.automation.outcome == 'success' }}
        env:
          OFFICIAL_VERSION: ${{ needs.resolve.outputs.official-version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node ../automation/scripts/select-development-host.mjs \
            --source "$PWD" --directory "$RUNNER_TEMP/extras-host" --version "$OFFICIAL_VERSION"
      - name: Install interactive visualizer
        id: example-install
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm ci --prefix examples/interactive-visualizer --ignore-scripts --no-audit --no-fund
      - name: Build interactive visualizer
        id: example-build
        if: ${{ !cancelled() && steps.example-install.outcome == 'success' }}
        run: npm run --prefix examples/interactive-visualizer build
      - name: Build extension
        id: build
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        run: npm run build
      - name: Quality acceptance
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        run: npm run check:quality
      - name: Published types resolve from the packed tarball
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          echo '{"private":true}' > package.json
          npm install --omit=dev --no-audit --no-fund "$RUNNER_TEMP"/fitchmultz-pi-mcp-adapter-*.tgz
          node "$GITHUB_WORKSPACE/extension/scripts/check-consumer-types.mjs" "$PWD/node_modules/@fitchmultz/pi-mcp-adapter"
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extras-host
          path: |
            ${{ runner.temp }}/extras-host/host.json
            ${{ runner.temp }}/extras-host/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Interactive visualizer
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.example-build.outcome == 'success' }}
        run: npm exec -- vitest run __tests__/interactive-visualizer-*.test.ts
      - name: Protocol conformance
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        run: npm run test:conformance
